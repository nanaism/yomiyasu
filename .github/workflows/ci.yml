name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  twins:
    name: Copies in skills/yomiyasu match
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: references/ and skills/yomiyasu/references/ are identical
        run: diff -r references skills/yomiyasu/references
      - name: scripts/ and skills/yomiyasu/scripts/ are identical
        # scripts/ also holds the corpus tools that are not distributed, so compare file by file in both directions.
        run: |
          status=0
          for file in skills/yomiyasu/scripts/*; do
            cmp "$file" "scripts/${file##*/}" || status=1
          done
          for file in scripts/yomiyasu_*.py scripts/markdown_visibility.py; do
            cmp "$file" "skills/yomiyasu/scripts/${file##*/}" || status=1
          done
          exit "$status"

  python-quality:
    name: Python annotations and pathlib
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python checkers
        run: python -m pip install --disable-pip-version-check ruff==0.17.3 ty==0.0.92
      - name: Check annotations and path operations
        run: ruff check --isolated --select ANN,PTH --target-version py39 skills/yomiyasu/scripts
      - name: Check Python 3.9 types
        run: ty check --python-version 3.9 skills/yomiyasu/scripts

  test:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.part }})
    # Pinned rather than ubuntu-latest: Python 3.9 is past its end of life and may not be built for newer images.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
        # The tests that do not measure time are dealt into numbered parts (tests/conftest.py, --part), one job each.
        # The last entry runs the timing tests. tests/test_ci_parts.py checks that this list and the commands agree.
        part: ["1/3", "2/3", "3/3", "timing"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest pytest-xdist
      - name: Run one part of the test suite
        if: matrix.part != 'timing'
        run: python -m pytest -q -ra --durations=25 -n auto --dist worksteal -m "not timing" --part ${{ matrix.part }}
      # Timing tests compare elapsed time with a limit; run them one at a time in their own job so that other tests do not load the CPU.
      - name: Run the timing tests
        if: matrix.part == 'timing'
        run: python -m pytest -q -ra --durations=10 -m timing

  test-windows:
    name: pytest (Windows, Python 3.12, ${{ matrix.part }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ["1/3", "2/3", "3/3", "timing"]
    steps:
      # Keep the committed line endings: the tests and fixtures compare bytes, and Windows runners convert to CRLF by default.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest pytest-xdist
      - name: Run one part of the test suite
        if: matrix.part != 'timing'
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -ra --durations=25 -n auto --dist worksteal -m "not timing" --part ${{ matrix.part }}
      - name: Run the timing tests
        if: matrix.part == 'timing'
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -ra --durations=10 -m timing

  test-windows-drive-relative:
    name: Drive-relative paths (Windows, Python 3.9)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Exercise native drive-relative records
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -p test_windows_drive_relative.py -v
